<!-- AI Voice Receptionist Widget -->
<script>
  (function(d, t) {
    var g = d.createElement(t),
    s = d.getElementsByTagName(t)[0];
    g.src = "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";
    g.defer = true;
    g.async = true;
    s.parentNode.insertBefore(g, s);

    g.onload = function() {
      window.vapiSDK.run({
        apiKey: "YOUR_PUBLIC_VAPI_KEY_HERE", // Example: 01959e46-...
        assistant: "YOUR_ASSISTANT_ID_HERE", // Example: 691125c3-...
        config: {
          position: "bottom-right", // You can change to 'bottom-left'
          offset: "40px",
          width: "50px",
          height: "50px",
          idle: {
            color: "rgb(46, 204, 113)",
            type: "pill",
            title: "Call Receptionist",
            subtitle: "Talk with our AI",
            icon: "https://unpkg.com/lucide@latest/icons/phone.svg"
          },
          loading: {
            color: "rgb(241, 196, 15)",
            type: "pill",
            title: "Connecting...",
            subtitle: "Please wait",
            icon: "https://unpkg.com/lucide@latest/icons/loader-2.svg"
          },
          active: {
            color: "rgb(231, 76, 60)",
            type: "pill",
            title: "Call is active...",
            subtitle: "End the call",
            icon: "https://unpkg.com/lucide@latest/icons/phone-off.svg"
          }
        }
      });
    };
  })(document, "script");
</script>
